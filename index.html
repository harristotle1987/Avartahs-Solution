<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111315">
    <link rel="manifest" href="/manifest.json">
    <title>Avartah Solutions | Engineered Revenue Systems & Digital Consultancy</title>
    <meta name="description" content="Avartah Solutions delivers engineered revenue systems, custom software, high-conversion web platforms, and automated prospect intelligence for growth-minded enterprises.">
    <meta property="og:title" content="Avartah Solutions | Engineered Revenue Systems & Digital Consultancy">
    <meta property="og:description" content="Avartah Solutions delivers engineered revenue systems, custom software, high-conversion web platforms, and automated prospect intelligence.">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23111315'/%3E%3Cpath d='M30 72 L50 24 L70 72 M38 56 L62 56' stroke='%23C58A52' stroke-width='7' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="globals.css">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('avartah-theme');
          if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
      // Shim process.env for browser compatibility
      window.process = window.process || { env: {} };
      
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              obsidian: {
                bg: '#111315',
                secondary: '#171A1D',
                surface: '#202428',
                primary: '#F2F1ED',
                muted: '#747C84',
                secondaryText: '#A3A9AF',
                border: '#30363B',
                bronze: '#C58A52',
                'bronze-hover': '#D99B62',
                'bronze-muted': 'rgba(197, 138, 82, 0.12)',
                success: '#1E7F55',
                warning: '#D97706',
                error: '#DC2626',
              },
            },
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
              editorial: ['Playfair Display', 'Georgia', 'serif'],
            },
            borderRadius: {
              'DEFAULT': '8px',
              'md': '8px',
              'lg': '10px',
              'xl': '12px',
            }
          }
        }
      }
    </script>
</head>
<body class="bg-[#F8FAFC] dark:bg-[#111315] text-[#111315] dark:text-[#F2F1ED] antialiased overflow-x-hidden selection:bg-[#C58A52]/20 selection:text-[#C58A52] transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
</body>
</html>
